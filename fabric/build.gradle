import net.darkhax.curseforgegradle.TaskPublishCurseForge

apply plugin: 'net.fabricmc.fabric-loom'

dependencies {
    implementation project(':common')

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

base {
    archivesName = "ConfigManager-${project.name}-${project.minecraft_version}"
}

processResources {
    def expandProps = [
            "version"                       : project.version,
            "mod_id"                        : project.mod_id,
            "mod_name"                      : project.mod_name,
            "description"                   : project.description,
            "mod_author"                    : project.mod_author,
            "license"                       : project.license,
            "mod_url"                       : project.mod_url,
            "mod_sources"                   : project.mod_sources,
            "mod_issue_tracker"             : project.mod_issue_tracker,
            "loader_version"                : project.fabric_loader_version,
            "minecraft_version"             : project.minecraft_version,
            "minecraft_version_range_fabric": project.minecraft_version_range_fabric,
    ]
    inputs.properties expandProps

    filesMatching("fabric.mod.json") {
        expand expandProps
    }
}

jar {
    from project(':common').sourceSets.main.output
}

def parsedChangelog = rootProject.file('CHANGELOG.md').getText('UTF-8')

if (System.getenv("MODRINTH_TOKEN") != null) {
    modrinth {
        group = "upload"
        token = System.getenv("MODRINTH_TOKEN")
        projectId = "ehPxCT2J"
        versionNumber = project.version
        versionName = tasks.jar.archiveFile.get().asFile.name
        versionType = release_type
        changelog = parsedChangelog
        uploadFile = tasks.jar
        gameVersions = ["26.1.2", "26.2", "26.3"]
        loaders = ["fabric", "quilt"]
    }
}

if (System.getenv("CURSEFORGE_TOKEN") != null) {
    tasks.register("publishCurseForge", TaskPublishCurseForge) {
        group = "upload"
        apiToken = System.getenv("CURSEFORGE_TOKEN")

        def mainFile = upload("963806", tasks.jar)
        mainFile.displayName = tasks.jar.archiveFile.get().asFile.name
        mainFile.changelog = parsedChangelog
        mainFile.changelogType = "markdown"
        mainFile.releaseType = release_type

        mainFile.addGameVersion("26.1.2", "26.2", "26.3")
        mainFile.addEnvironment("Client")
        mainFile.addModLoader("Fabric", "Quilt")
    }
}

tasks.register('publishUnified') {
    group = "upload"
    if (System.getenv("MODRINTH_TOKEN") != null) dependsOn(tasks.modrinth)
    if (System.getenv("CURSEFORGE_TOKEN") != null) dependsOn(tasks.publishCurseForge)
}

tasks.register('publishUnifiedToLocal', Copy) {
    group = "upload"
    dependsOn(tasks.jar)
    from(tasks.jar.archiveFile)
    into("build/unified-local/project0")
}
