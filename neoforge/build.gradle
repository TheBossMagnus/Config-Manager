apply plugin: 'net.neoforged.moddev'
base {
    archivesName = "ConfigManager-${project.name}-${project.minecraft_version}"
}

neoForge {
    version = project.neoforge_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Common project source files for compilation
    compileOnly project(':common')
}

processResources {
    var replaceProperties = [
            mod_id                          : project.mod_id,
            mod_name                        : project.mod_name,
            description                     : project.description,
            mod_author                      : project.mod_author,
            version                         : project.version,
            license                         : project.license,
            mod_url                         : project.mod_url,
            mod_issue_tracker               : project.mod_issue_tracker,
            neoforge_loader_version_range   : project.neoforge_loader_version_range,
            minecraft_version_range_neoforge: project.minecraft_version_range_neoforge,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

jar {
    from project(':common').sourceSets.main.output
}