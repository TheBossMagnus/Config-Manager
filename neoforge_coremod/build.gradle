import net.darkhax.curseforgegradle.TaskPublishCurseForge

apply plugin: 'net.neoforged.moddev'
apply plugin: 'com.modrinth.minotaur'

base {
    archivesName = "ConfigManager-neoforge-${project.minecraft_version}"
}

neoForge {
    version = project.neoforge_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly project(':common')
}

jar {
    from(project(':neoforge').tasks.jar) {
        rename { "config_manager-neoforge.jar" }
        into 'META-INF/jarjar'
    }
    from(zipTree(project(':neoforge').tasks.jar.archiveFile.get().asFile)) {
        include 'META-INF/neoforge.mods.toml'
        into ''
    }
}

def parsedChangelog = rootProject.file('CHANGELOG.md').getText('UTF-8')

if (System.getenv("MODRINTH_TOKEN") != null) {
    modrinth {
        group = "upload"
        token = System.getenv("MODRINTH_TOKEN")
        projectId = "jlNms3Jp"
        versionNumber = project.version
        versionName = tasks.jar.archiveFile.get().asFile.name
        versionType = release_type
        changelog = parsedChangelog
        uploadFile = tasks.jar
        gameVersions = ["26.1.2", "26.2", "26.3"]
        loaders = ["neoforge"]
    }
}

if (System.getenv("CURSEFORGE_TOKEN") != null) {
    tasks.register("publishCurseForge", TaskPublishCurseForge) {
        group = "upload"
        apiToken = System.getenv("CURSEFORGE_TOKEN")

        def mainFile = upload("1340480", tasks.jar)
        mainFile.displayName = tasks.jar.archiveFile.get().asFile.name
        mainFile.changelog = parsedChangelog
        mainFile.changelogType = "markdown"
        mainFile.releaseType = release_type

        mainFile.addGameVersion("26.1.2", "26.2", "26.3")
        mainFile.addEnvironment("Client")
        mainFile.addModLoader("NeoForge")
    }
}

tasks.register('publishUnified') {
    group = "upload"
    if (System.getenv("MODRINTH_TOKEN") != null) dependsOn(tasks.modrinth)
    if (System.getenv("CURSEFORGE_TOKEN") != null) dependsOn(tasks.publishCurseForge)
}

tasks.register('publishUnifiedToLocal', Copy) {
    group = "upload"
    dependsOn(tasks.jar)
    from(tasks.jar.archiveFile)
    into("build/unified-local/project0")
}